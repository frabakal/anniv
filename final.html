<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decorate & Download</title>

  <!-- Favicon -->
  <link rel="icon" href="Assets/fish-photobooth/favicon.png" type="image/x-icon" />
  <link rel="stylesheet" href="StyleSheets/final.css" />
</head>
<body>
  <div class="logo">
    <img src="Assets/fish-photobooth/menupage/Header.png" alt="Logo">
  </div>

  <div class="heading-content">
    <div class="menu-header" style="display: none;"></div>
    <div class="sticker-container">
      <h1>Add Stickers!</h1>
      <p>(drag to reposition)</p>
      <div class="sticker-btns">
        <button id="addBlush" class="sticker-btn blush-btn">Add Blush</button>
        <button id="addRibbon" class="sticker-btn ribbon-btn">Add Ribbon</button>
        <button id="addSparkle" class="sticker-btn sparkle-btn">Add Sparkle</button>
        <button id="addKiss" class="sticker-btn kiss-btn">Add Kiss</button>
        <button id="addHeart" class="sticker-btn heart-btn">Add Heart</button>
        <button id="addWhat" class="sticker-btn what-btn">Add ?!</button>
        <button id="reset" class="sticker-btn reset-btn">Reset</button>
      </div>
    </div>
  </div>

  <div id="canvasContainer">
    <canvas id="finalCanvas" width="600" height="1800"></canvas>
  </div>

  <div class="button-container">
    <button id="downloadBtn">Download</button>
    <button id="homeBtn">Home</button>
  </div>

  <script type="module" src="Javascripts/final.js"></script>
  <script language="JavaScript">
  window.onbeforeunload = confirmExit;
  function confirmExit()
  {
    return "some message about leaving";
  }
</script>
</body>
</html>

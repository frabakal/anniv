<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu</title>

  <!-- Favicon -->
  <link rel="icon" href="Assets/fish-photobooth/favicon.png" type="image/x-icon" />
  <link rel="stylesheet" href="StyleSheets/theatre.css" />
</head>
<body>

  <div class="logo">
    <img src="Assets/fish-photobooth/homepage/animated-archives/archives-header.png" alt="Logo">
  </div>

<div class="main-layout">
    
  <div class="theatre-frame">
    <video
      class="theatre-video"
      controls
      playsinline
    >
      <source src="https://res.cloudinary.com/ps8kst9z/video/upload/1st_Anniv.mov" type="video/mp4">
    </video>

    <img
      class="frame-overlay"
      src="Assets/fish-photobooth/homepage/animated-archives/2.png"
      alt=""
    >
  </div>
  
</div>
<div class="button-container">
      <button id="next-loc-button">&#10094; Exit Theatre</button>
    </div>

  <script src="Javascripts/archives.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Camera</title>

<link rel="icon" href="Assets/fish-photobooth/favicon.png">
<link rel="stylesheet" href="StyleSheets/camera.css">

</head>

<body>

<div class="logo">
    <img src="Assets/fish-photobooth/menupage/Header.png" alt="Logo">
</div>

<div class="main-layout">

    <!-- LEFT -->
    <div class="camera-preview">

        <div class="countdown-timer">3</div>

        <video
            id="liveVideo"
            autoplay
            playsinline
            muted>
        </video>

    </div>

    <!-- RIGHT -->
    <div class="photobooth-container">

        <canvas
            id="finalCanvas"
            width="600"
            height="1800">
        </canvas>

        <img
            id="frameOverlay"
            class="frame-overlay"
            src="Assets/fish-photobooth/camerapage/frame1.png"
            alt="Frame">
    </div>

</div>

<div class="controls">
    <button id="takePhoto">Capture</button>
    
    <button id="prevFrame" class="frame-nav">&#10094;</button>
    <button id="nextFrame" class="frame-nav">&#10095;</button>
</div>

<script src="Javascripts/camera.js"></script>

</body>
</html>
